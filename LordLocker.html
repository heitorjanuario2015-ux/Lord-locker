<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lord Locker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Segoe+UI:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f0e;
            color: #00ff66;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .portal-container {
            text-align: center;
            max-width: 450px;
            width: 90%;
            background: rgba(0, 20, 10, 0.95);
            border: 2px solid #00ff66;
            border-radius: 16px;
            padding: 35px 25px;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);
        }

        .assinatura-lord {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
            margin-bottom: 15px;
        }

        .descricao {
            color: #8cbf9f;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-inicio {
            background: linear-gradient(135deg, #00ff66, #00cc52);
            color: #0b0f0e;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.8);
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <h1 class="assinatura-lord">Lord Locker</h1>
        <p class="descricao">
            Bem-vindo ao portal oficial. Um espaço exclusivo criado para centralizar os melhores conteúdos, novidades e o acesso direto ao seu destino principal.
        </p>
        
        <!-- Botão com o seu link oficial do Sprite Locker -->
        <a href="https://spritelocker.com/pt-BR#c=4.d3cB4O4G7o4AAAAAAAAAAAAAAAAAAACAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" class="btn-inicio">Ir pra página inicial 🔥</a>
    </div>

</body>
</html>
